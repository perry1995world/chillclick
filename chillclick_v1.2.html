<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>심신안정</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}

:root{
  --cream:#F0ECE2;--cream2:#E0DBD0;--cream3:#D0CBB8;
  --ks:#FDFAF4;--kside:#C4BFB5;--kshad:#A8A39A;
  --acc:#CF3E50;--acc2:#E85A6A;--pink:#F2A5AE;
  --txt:#3A3530;--sub:#A8A49C;
  --gold:#C49A20;--gold2:#8B6914;--yellow:#FFD96A;
}

body{
  font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  background:var(--bg,var(--cream));
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;overflow-y:auto;
  user-select:none;
  transition:background .5s;
}

/* ── 앱 래퍼 (모바일 시뮬레이션) ── */
.app{
  width:100%;max-width:390px;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;
  position:relative;overflow:hidden;
  background:var(--bg,var(--cream));
  transition:background .5s;
}

/* ── 헤더 ── */
.header{
  padding:20px 20px 0;
  display:flex;align-items:center;justify-content:space-between;
}
.logo{
  font-size:20px;font-weight:900;
  color:var(--acc,#CF3E50);letter-spacing:-0.5px;
}
.logo span{font-size:11px;font-weight:500;color:var(--sub);margin-left:4px;letter-spacing:0;}
.tier-badge{
  font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;
  transition:all .3s;
}
.tier-badge.free{background:#E8E4DA;color:#A8A49C;}
.tier-badge.premium{background:linear-gradient(135deg,#FFD96A,#C49A20);color:#5A3E00;}
.tier-badge.guest{background:#F0ECE2;color:#C4BFB5;border:1px solid #DDD8CE;}

/* ── 테마 탭 ── */
.theme-tabs{
  display:flex;gap:8px;
  padding:16px 20px 0;
  overflow-x:auto;scrollbar-width:none;
}
.theme-tabs::-webkit-scrollbar{display:none;}
.tab{
  flex-shrink:0;
  padding:8px 14px;border-radius:20px;
  font-size:12px;font-weight:700;
  border:1.5px solid transparent;
  background:#E8E4DA;color:#A8A49C;
  cursor:pointer;transition:all .2s;
  display:flex;align-items:center;gap:5px;
}
.tab.active{
  background:var(--acc,#CF3E50);color:#fff;
  border-color:var(--acc,#CF3E50);
}
.tab.locked{
  background:#F5F3EE;color:#CCC8C0;
  position:relative;
}
.tab.locked::after{
  content:'🔒';font-size:9px;margin-left:2px;
}

/* ── 메인 영역 ── */
.main{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:28px 20px 20px;gap:0;
}

/* ── 체인 ── */
.chain{margin-bottom:-2px;padding-left:20px;align-self:flex-start;}

/* ── 키캡 바디 ── */
.keycap-body{
  background:var(--kbody,#E0DBD0);
  border-radius:18px;padding:11px;gap:7px;
  display:grid;grid-template-columns:1fr 1fr;
  box-shadow:
    0 10px 0 var(--kside2,#C4BFB5),
    0 14px 0 var(--kshad2,#A8A39A),
    0 18px 28px rgba(0,0,0,.16);
  cursor:pointer;
  transition:transform .07s cubic-bezier(.2,0,.6,1),box-shadow .07s cubic-bezier(.2,0,.6,1);
  position:relative;will-change:transform;
  width:270px;height:270px;
}
.keycap-body.pressed{
  transform:translateY(10px);
  box-shadow:0 1px 0 var(--kside2,#C4BFB5),0 3px 0 var(--kshad2,#A8A39A),0 5px 10px rgba(0,0,0,.1);
}

.key{
  border-radius:11px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;
  position:relative;
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.07),inset 0 2px 3px rgba(255,255,255,.65);
  transition:background .4s,color .4s;
}
.key-text{font-size:26px;}
.key-icon svg{width:52px;height:52px;}

/* ── 카운터 ── */
.counter-wrap{
  margin-top:28px;text-align:center;
}
.count-num{
  font-size:58px;font-weight:900;
  color:var(--acc,#CF3E50);
  line-height:1;display:block;
  transition:color .4s;
}
.count-num.pop{animation:numPop .18s ease-out;}
@keyframes numPop{0%{transform:scale(1)}50%{transform:scale(1.2)}100%{transform:scale(1)}}
.count-label{font-size:13px;color:var(--sub);margin-top:3px;}

/* ── 진행 바 (무료 회원용) ── */
.progress-wrap{
  width:100%;margin-top:14px;
  padding:0 4px;
}
.progress-bar{
  height:4px;background:#E8E4DA;border-radius:4px;overflow:hidden;
}
.progress-fill{
  height:100%;border-radius:4px;
  background:var(--acc,#CF3E50);
  transition:width .3s ease,background .4s;
}
.progress-label{
  display:flex;justify-content:space-between;
  font-size:10px;color:var(--sub);margin-top:4px;
}

/* ── 공유 버튼 ── */
.share-btn{
  margin-top:20px;
  padding:13px 32px;border-radius:30px;
  background:var(--acc,#CF3E50);color:#fff;
  font-size:14px;font-weight:700;
  border:none;cursor:pointer;
  display:flex;align-items:center;gap:7px;
  box-shadow:0 4px 16px rgba(0,0,0,.12);
  transition:all .2s;
  -webkit-tap-highlight-color:transparent;
}
.share-btn:active{transform:scale(.96);}

/* ── 데모 티어 스위처 (프로토타입 전용) ── */
.demo-switcher{
  margin-top:auto;
  width:100%;padding:16px 20px;
  background:rgba(0,0,0,.04);
  border-top:1px solid rgba(0,0,0,.06);
}
.demo-label{
  font-size:10px;color:var(--sub);font-weight:600;
  letter-spacing:.5px;margin-bottom:8px;
  text-align:center;
}
.demo-btns{display:flex;gap:6px;}
.demo-btn{
  flex:1;padding:8px 0;border-radius:10px;
  font-size:11px;font-weight:700;
  border:1.5px solid #DDD8CE;
  background:#fff;color:#A8A49C;
  cursor:pointer;transition:all .2s;
}
.demo-btn.active{
  background:var(--txt,#3A3530);color:#fff;border-color:var(--txt,#3A3530);
}

/* ── 광고 오버레이 ── */
.ad-overlay{
  position:absolute;inset:0;z-index:80;
  background:rgba(240,236,226,.96);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:0;
  opacity:0;pointer-events:none;
  transition:opacity .3s;
}
.ad-overlay.show{opacity:1;pointer-events:all;}

.ad-box{
  width:270px;
  background:#fff;border-radius:18px;
  overflow:hidden;
  box-shadow:0 8px 32px rgba(0,0,0,.12);
}
.ad-tag{
  background:#FF5A5A;color:#fff;
  font-size:10px;font-weight:800;
  padding:6px 12px;letter-spacing:.5px;
}
.ad-content{
  padding:24px;text-align:center;
}
.ad-img{
  width:100%;height:120px;
  background:linear-gradient(135deg,#E8E4DA,#D0CBB8);
  border-radius:10px;margin-bottom:16px;
  display:flex;align-items:center;justify-content:center;
  font-size:40px;
}
.ad-title{font-size:15px;font-weight:700;color:#3A3530;margin-bottom:6px;}
.ad-desc{font-size:12px;color:#A8A49C;line-height:1.5;}
.ad-cta{
  margin-top:14px;width:100%;padding:11px;
  border-radius:10px;background:#3A3530;color:#fff;
  font-size:13px;font-weight:700;border:none;cursor:pointer;
}

.ad-timer{
  margin-top:16px;
  font-size:13px;color:var(--sub);
  display:flex;align-items:center;gap:6px;
}
.timer-circle{
  width:32px;height:32px;
}
.timer-num{
  font-size:15px;font-weight:800;color:var(--acc,#CF3E50);
}

/* ── 리셋 팝업 ── */
.reset-overlay{
  position:absolute;inset:0;z-index:90;
  background:rgba(30,25,20,.6);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.reset-overlay.show{opacity:1;pointer-events:all;}

.reset-card{
  width:300px;background:#fff;border-radius:20px;
  padding:28px 24px 24px;
  position:relative;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
  animation:cardIn .3s cubic-bezier(.3,0,.5,1.2);
}
@keyframes cardIn{from{transform:scale(.88) translateY(20px)}to{transform:scale(1) translateY(0)}}

.reset-close{
  position:absolute;top:14px;right:14px;
  width:28px;height:28px;border-radius:50%;
  background:#F0ECE2;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  font-size:14px;color:#A8A49C;
  transition:background .2s;
}
.reset-close:hover{background:#E0DBD0;}

.reset-emoji{font-size:48px;text-align:center;display:block;margin-bottom:12px;}
.reset-title{font-size:18px;font-weight:900;color:#3A3530;text-align:center;margin-bottom:8px;}
.reset-desc{font-size:13px;color:#A8A49C;text-align:center;line-height:1.6;margin-bottom:20px;}
.reset-upsell{
  background:#FFF8E8;border-radius:12px;padding:14px;
  margin-bottom:16px;
  border:1.5px solid #FFD96A;
}
.reset-upsell-title{font-size:12px;font-weight:800;color:#8B6914;margin-bottom:4px;}
.reset-upsell-desc{font-size:11px;color:#A8986C;line-height:1.5;}
.reset-btn{
  width:100%;padding:13px;border-radius:12px;
  background:#3A3530;color:#fff;
  font-size:14px;font-weight:700;border:none;cursor:pointer;
  margin-bottom:8px;transition:background .2s;
}
.reset-btn-upgrade{
  width:100%;padding:13px;border-radius:12px;
  background:linear-gradient(135deg,#FFD96A,#C49A20);color:#5A3E00;
  font-size:14px;font-weight:800;border:none;cursor:pointer;
}

/* ── 공유 팝업 ── */
.share-overlay{
  position:absolute;inset:0;z-index:90;
  background:rgba(30,25,20,.5);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .3s;
}
.share-overlay.show{opacity:1;pointer-events:all;}

.share-sheet{
  width:100%;background:#fff;
  border-radius:24px 24px 0 0;
  padding:20px;
  transform:translateY(100%);transition:transform .35s cubic-bezier(.3,0,.4,1);
}
.share-overlay.show .share-sheet{transform:translateY(0);}

.share-handle{width:40px;height:4px;background:#E0DBD0;border-radius:4px;margin:0 auto 20px;}
.share-preview{
  background:var(--bg,var(--cream));border-radius:16px;
  padding:20px;text-align:center;margin-bottom:20px;
}
.share-big-num{font-size:48px;font-weight:900;color:var(--acc,#CF3E50);}
.share-theme-name{font-size:14px;font-weight:700;color:var(--txt,#3A3530);margin-top:4px;}
.share-msg{font-size:12px;color:var(--sub);margin-top:2px;}
.share-watermark{font-size:11px;font-weight:800;color:var(--sub);margin-top:8px;}

.share-actions{display:flex;gap:10px;margin-bottom:12px;}
.share-action{
  flex:1;padding:13px;border-radius:12px;
  border:1.5px solid #E8E4DA;
  background:#fff;cursor:pointer;
  font-size:12px;font-weight:700;color:#3A3530;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  transition:background .2s;
}
.share-action:active{background:#F5F3EE;}
.share-action-icon{font-size:22px;}
.share-cancel{
  width:100%;padding:13px;border-radius:12px;
  background:#F5F3EE;color:#A8A49C;
  font-size:14px;font-weight:700;border:none;cursor:pointer;
}

/* ── 플로팅 텍스트 ── */
.float-msg{
  position:fixed;font-weight:900;
  pointer-events:none;z-index:99;white-space:nowrap;
  animation:floatUp 1.6s cubic-bezier(.2,0,.4,1) forwards;
}
@keyframes floatUp{
  0%{opacity:1;transform:translateY(0) scale(1) rotate(var(--r))}
  30%{opacity:1;transform:translateY(-40px) scale(1.06) rotate(var(--r))}
  100%{opacity:0;transform:translateY(-140px) scale(.85) rotate(var(--r))}
}

/* ── 파티클 ── */
.particle{
  position:fixed;width:9px;height:9px;border-radius:2px;
  pointer-events:none;z-index:98;
  animation:pFly .85s ease-out forwards;
}
@keyframes pFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--px),var(--py)) scale(.2)}}

/* ── 토스트 ── */
.toast{
  position:fixed;bottom:100px;left:50%;transform:translateX(-50%);
  background:#3A3530;color:#fff;
  padding:10px 20px;border-radius:20px;
  font-size:13px;font-weight:600;
  z-index:200;white-space:nowrap;
  animation:toastIn .2s ease-out;
  pointer-events:none;
}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* 배경 키캡 */
.bg-key{
  position:absolute;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-weight:900;pointer-events:none;
  box-shadow:0 4px 0 rgba(0,0,0,.08);
  transition:opacity .5s;
}
</style>
</head>
<body>

<div class="app" id="app">

  <!-- 배경 키캡들 -->
  <div id="bgKeys"></div>

  <!-- 헤더 -->
  <div class="header">
    <div class="logo">심신안정 <span>v1.2</span></div>
    <div class="tier-badge guest" id="tierBadge">비회원</div>
  </div>

  <!-- 테마 탭 -->
  <div class="theme-tabs" id="themeTabs">
    <div class="tab active" data-theme="home" onclick="setTheme('home',this)">🏠 집가고싶다</div>
    <div class="tab" data-theme="lottery" onclick="setTheme('lottery',this)">🍀 복권당첨</div>
    <div class="tab locked" onclick="showUpgrade()">💸 월급올려줘</div>
    <div class="tab locked" onclick="showUpgrade()">😴 그냥쉬고싶다</div>
  </div>

  <!-- 메인 -->
  <div class="main">

    <!-- 체인 SVG -->
    <div class="chain">
      <svg width="56" height="44" viewBox="0 0 56 44" fill="none">
        <ellipse cx="28" cy="13" rx="11" ry="7.5" stroke="#C0C4CC" stroke-width="2.8" fill="none"/>
        <rect x="16" y="26" width="22" height="13" rx="5" fill="#C8CCCC" stroke="#B0B4B8" stroke-width="1.4"/>
        <rect x="23" y="22" width="9" height="9" rx="3" fill="#D4D8D8" stroke="#B0B4B8" stroke-width="1.4"/>
        <path d="M42 29 C42 27 40 25.5 38.5 25.5 C37 25.5 35 27 35 29 C35 31.5 38.5 34 38.5 34 C38.5 34 42 31.5 42 29Z" fill="#E85A6A" opacity=".85"/>
      </svg>
    </div>

    <!-- 키캡 바디 -->
    <div class="keycap-body" id="keycapBody">
      <div class="key" id="key1" style="background:var(--ks)"><span class="key-text" id="k1" style="color:#CF3E50">집</span></div>
      <div class="key" id="key2" style="background:#F2A5AE">
        <span class="key-icon" id="k2">
          <svg viewBox="0 0 52 52" fill="none">
            <path d="M26 44C26 44 6 32 6 18c0-6 4-10 10-10 4 0 7 2 10 5 3-3 6-5 10-5 6 0 10 4 10 10 0 14-20 26-20 26z" fill="white" opacity=".9"/>
            <line x1="14" y1="20" x2="36" y2="20" stroke="#F2A5AE" stroke-width="2.5" stroke-linecap="round"/>
            <polyline points="30,14 37,20 30,26" stroke="#F2A5AE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
      </div>
      <div class="key" id="key3" style="background:var(--ks)"><span class="key-text" id="k3" style="color:#CF3E50">가고</span></div>
      <div class="key" id="key4" style="background:var(--ks)"><span class="key-text" id="k4" style="color:#CF3E50">싶다</span></div>
    </div>

    <!-- 카운터 -->
    <div class="counter-wrap">
      <span class="count-num" id="countNum">0</span>
      <div class="count-label">번 눌렀어요</div>
    </div>

    <!-- 진행바 (무료 회원) -->
    <div class="progress-wrap" id="progressWrap" style="display:none">
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
      <div class="progress-label"><span id="progressLeft"></span><span id="progressRight">159회 리셋</span></div>
    </div>

    <!-- 공유 버튼 -->
    <button class="share-btn" onclick="openShare()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
        <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
      </svg>
      클릭 수 공유하기
    </button>

  </div><!-- /main -->

  <!-- 데모 티어 스위처 -->
  <div class="demo-switcher">
    <div class="demo-label">🛠 PROTOTYPE — 회원 등급 전환</div>
    <div class="demo-btns">
      <button class="demo-btn active" onclick="setTier('guest',this)">비회원</button>
      <button class="demo-btn" onclick="setTier('free',this)">무료 회원</button>
      <button class="demo-btn" onclick="setTier('premium',this)">유료 회원 ✨</button>
    </div>
  </div>

  <!-- ── 광고 오버레이 ── -->
  <div class="ad-overlay" id="adOverlay">
    <div class="ad-box">
      <div class="ad-tag">AD · 광고</div>
      <div class="ad-content">
        <div class="ad-img" id="adEmoji">🏠</div>
        <div class="ad-title" id="adTitle">오늘도 집이 그리운 당신께</div>
        <div class="ad-desc" id="adDesc">배달의민족과 함께라면<br>집이 더 좋아집니다 🍕</div>
        <button class="ad-cta">자세히 보기</button>
      </div>
    </div>
    <div class="ad-timer">
      <svg class="timer-circle" viewBox="0 0 32 32">
        <circle cx="16" cy="16" r="13" fill="none" stroke="#E0DBD0" stroke-width="2.5"/>
        <circle cx="16" cy="16" r="13" fill="none" stroke="#CF3E50" stroke-width="2.5"
          stroke-dasharray="82" stroke-dashoffset="82" stroke-linecap="round"
          id="timerCircle" transform="rotate(-90 16 16)"/>
      </svg>
      <span class="timer-num" id="timerNum">5</span>
      <span style="font-size:12px;color:#A8A49C">초 후 계속하기</span>
    </div>
  </div>

  <!-- ── 리셋 팝업 ── -->
  <div class="reset-overlay" id="resetOverlay">
    <div class="reset-card">
      <button class="reset-close" onclick="closeReset()">✕</button>
      <span class="reset-emoji">😮‍💨</span>
      <div class="reset-title">초기화 시간이에요</div>
      <div class="reset-desc">오늘의 심신안정 <strong>159번</strong> 달성!<br>닫으면 자동으로 0부터 다시 시작돼요.</div>
      <div class="reset-upsell">
        <div class="reset-upsell-title">✨ 유료 회원이라면?</div>
        <div class="reset-upsell-desc">횟수 제한 없이 무제한으로 누를 수 있어요.<br>광고도 없고, 클릭 수도 저장돼요.</div>
      </div>
      <button class="reset-btn-upgrade" onclick="closeReset();showToast('유료 전환 페이지로 이동합니다 (준비중)')">✨ 유료 회원 전환하기</button>
      <div style="height:8px"></div>
      <button class="reset-btn" onclick="closeReset()">닫고 처음부터 시작</button>
    </div>
  </div>

  <!-- ── 공유 시트 ── -->
  <div class="share-overlay" id="shareOverlay" onclick="closeShare(event)">
    <div class="share-sheet">
      <div class="share-handle"></div>
      <div class="share-preview" id="sharePreview">
        <div class="share-big-num" id="shareNum">0</div>
        <div class="share-theme-name" id="shareThemeName">🏠 집가고싶다</div>
        <div class="share-msg" id="shareMsg">번 눌렀어요</div>
        <div class="share-watermark">— 심신안정 —</div>
      </div>
      <div class="share-actions">
        <button class="share-action" onclick="copyCount()"><span class="share-action-icon">📋</span>복사</button>
        <button class="share-action" onclick="nativeShare()"><span class="share-action-icon">📤</span>공유</button>
        <button class="share-action" onclick="saveImage()"><span class="share-action-icon">🖼️</span>이미지</button>
      </div>
      <button class="share-cancel" onclick="closeShare()">취소</button>
    </div>
  </div>

</div><!-- /app -->

<script>
/* ─── 상태 ─── */
const state = {
  tier: 'guest',   // guest | free | premium
  theme: 'home',   // home | lottery
  count: 0,
  adShowing: false,
  resetShowing: false,
  adTimer: null,
};

/* ─── 테마 정의 ─── */
const themes = {
  home: {
    bg: '#F0ECE2', kbody: '#E0DBD0', kside2: '#C4BFB5', kshad2: '#A8A39A',
    acc: '#CF3E50',
    keys: ['집','♥','가고','싶다'],
    key2type: 'heart',
    key2bg: '#F2A5AE',
    keyColor: '#CF3E50',
    msgs: ['집가고 싶다','퇴근하고 싶다','집에 가고파','제발','집!!!','집가자','밥먹고 싶다'],
    adEmoji:'🏠', adTitle:'집이 그리운 당신께', adDesc:'배달의민족과 함께라면 집이 더 좋아져요 🍕',
    bgkeys: ['ㅎ','ㅏ','ㅁ','집','♥','퇴','근'],
    particles: ['#CF3E50','#F2A5AE','#E85A6A','#F5C8CC'],
  },
  lottery: {
    bg: '#FFFBF0', kbody: '#F0E8C0', kside2: '#C8B870', kshad2: '#A89840',
    acc: '#8B6914',
    keys: ['복권','🍀','당첨','!!!'],
    key2type: 'clover',
    key2bg: '#FFD96A',
    keyColor: '#8B6914',
    msgs: ['당첨되면 좋겠다','로또 1등!','제발제발','777','🍀🍀🍀','돈돈돈','복권 사야지'],
    adEmoji:'🎰', adTitle:'오늘 로또 사셨나요?', adDesc:'동행복권 앱에서 편하게 구매하세요 🤑',
    bgkeys: ['복','권','🍀','당','첨','7','★'],
    particles: ['#C49A20','#FFD96A','#8B6914','#FFE89A'],
  },
};

/* ─── 배경 키캡 생성 ─── */
function buildBgKeys() {
  const container = document.getElementById('bgKeys');
  container.innerHTML = '';
  const t = themes[state.theme];
  for(let i=0;i<18;i++){
    const el = document.createElement('div');
    el.className = 'bg-key';
    const sz = 32 + Math.random()*24;
    el.style.cssText = `
      width:${sz}px;height:${sz}px;
      left:${Math.random()*92}%;top:${Math.random()*92}%;
      background:${state.theme==='home'?'#FDFAF4':'#FFF8E0'};
      color:${t.keyColor};font-size:${sz*.38}px;opacity:.25;
      transform:rotate(${-20+Math.random()*40}deg);
    `;
    el.textContent = t.bgkeys[Math.floor(Math.random()*t.bgkeys.length)];
    container.appendChild(el);
  }
}

/* ─── 테마 적용 ─── */
function setTheme(name, el) {
  if(name !== 'home' && state.tier === 'guest') { showToast('무료 회원 가입 후 이용 가능해요'); return; }
  state.theme = name;
  state.count = 0;
  document.getElementById('countNum').textContent = '0';
  updateProgress();

  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');

  const t = themes[name];
  const app = document.getElementById('app');
  app.style.background = t.bg;
  document.getElementById('keycapBody').style.background = t.kbody;
  document.getElementById('keycapBody').style.setProperty('--kside2', t.kside2);
  document.getElementById('keycapBody').style.setProperty('--kshad2', t.kshad2);
  document.getElementById('countNum').style.color = t.acc;
  document.getElementById('progressFill').style.background = t.acc;
  document.querySelector('.share-btn').style.background = t.acc;

  // 키 색상
  document.getElementById('key1').style.background = '#FDFAF4';
  document.getElementById('k1').style.color = t.keyColor;
  document.getElementById('key2').style.background = t.key2bg;
  document.getElementById('key3').style.background = name==='lottery'?'#FFF8E0':'#FDFAF4';
  document.getElementById('k3').style.color = t.keyColor;
  document.getElementById('k3').textContent = t.keys[2];
  document.getElementById('key4').style.background = name==='lottery'?'#FFF8E0':'#FDFAF4';
  document.getElementById('k4').style.color = t.keyColor;
  document.getElementById('k4').textContent = t.keys[3];
  document.getElementById('k1').textContent = t.keys[0];

  if(name === 'lottery') {
    document.getElementById('k2').innerHTML = '<span style="font-size:44px">🍀</span>';
  } else {
    document.getElementById('k2').innerHTML = `<svg viewBox="0 0 52 52" fill="none" width="52" height="52">
      <path d="M26 44C26 44 6 32 6 18c0-6 4-10 10-10 4 0 7 2 10 5 3-3 6-5 10-5 6 0 10 4 10 10 0 14-20 26-20 26z" fill="white" opacity=".9"/>
      <line x1="14" y1="20" x2="36" y2="20" stroke="#F2A5AE" stroke-width="2.5" stroke-linecap="round"/>
      <polyline points="30,14 37,20 30,26" stroke="#F2A5AE" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>`;
  }

  document.getElementById('adEmoji').textContent = t.adEmoji;
  document.getElementById('adTitle').textContent = t.adTitle;
  document.getElementById('adDesc').innerHTML = t.adDesc;
  buildBgKeys();
}

/* ─── 회원 등급 설정 ─── */
function setTier(tier, el) {
  state.tier = tier;
  state.count = 0;
  document.getElementById('countNum').textContent = '0';

  document.querySelectorAll('.demo-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');

  const badge = document.getElementById('tierBadge');
  badge.className = 'tier-badge';
  if(tier === 'free') { badge.classList.add('free'); badge.textContent = '무료 회원'; }
  else if(tier === 'premium') { badge.classList.add('premium'); badge.textContent = '✨ 유료 회원'; }
  else { badge.classList.add('guest'); badge.textContent = '비회원'; }

  updateProgress();
  showToast(tier === 'premium' ? '유료 회원으로 전환됩니다' : tier === 'free' ? '무료 회원으로 전환됩니다' : '비회원으로 전환됩니다');
}

/* ─── 진행바 업데이트 ─── */
function updateProgress() {
  const wrap = document.getElementById('progressWrap');
  if(state.tier !== 'free') { wrap.style.display = 'none'; return; }
  wrap.style.display = 'block';
  const pct = Math.min((state.count / 159) * 100, 100);
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressLeft').textContent = state.count + '회';
}

/* ─── 광고 체크 ─── */
function checkAd() {
  const c = state.count;
  if(state.tier === 'premium') return false;
  if(state.tier === 'guest' && c === 50) return true;
  if(state.tier === 'free' && (c === 50 || c === 100 || c === 150)) return true;
  return false;
}

/* ─── 광고 표시 ─── */
function showAd() {
  state.adShowing = true;
  const overlay = document.getElementById('adOverlay');
  overlay.classList.add('show');
  let t = 5;
  document.getElementById('timerNum').textContent = t;
  const circle = document.getElementById('timerCircle');
  circle.style.strokeDashoffset = 82;

  const interval = setInterval(() => {
    t--;
    document.getElementById('timerNum').textContent = t;
    const offset = 82 - (82 * (5 - t) / 5);
    circle.style.strokeDashoffset = offset;
    if(t <= 0) {
      clearInterval(interval);
      overlay.classList.remove('show');
      state.adShowing = false;
    }
  }, 1000);
}

/* ─── 리셋 팝업 ─── */
function showReset() {
  state.resetShowing = true;
  document.getElementById('resetOverlay').classList.add('show');
}
function closeReset() {
  document.getElementById('resetOverlay').classList.remove('show');
  state.resetShowing = false;
  state.count = 0;
  document.getElementById('countNum').textContent = '0';
  updateProgress();
}

/* ─── 공유 ─── */
function openShare() {
  document.getElementById('shareNum').textContent = state.count;
  document.getElementById('shareThemeName').textContent =
    state.theme === 'home' ? '🏠 집가고싶다' : '🍀 복권당첨';
  document.getElementById('shareOverlay').classList.add('show');
}
function closeShare(e) {
  if(!e || e.target.id === 'shareOverlay') {
    document.getElementById('shareOverlay').classList.remove('show');
  }
}
async function nativeShare() {
  const t = themes[state.theme];
  const text = `나 오늘 "${state.theme === 'home' ? '집가고싶다' : '복권당첨되면좋겠다'}" ${state.count}번 눌렀어 😮‍💨\n— 심신안정 앱`;
  if(navigator.share) {
    await navigator.share({ text });
  } else { copyCount(); }
}
function copyCount() {
  const text = `나 오늘 ${state.count}번 눌렀어 😮‍💨 — 심신안정`;
  navigator.clipboard?.writeText(text).then(() => showToast('복사됐어요!'));
  document.getElementById('shareOverlay').classList.remove('show');
}
function saveImage() { showToast('이미지 저장 (준비중)'); }

/* ─── 업그레이드 안내 ─── */
function showUpgrade() {
  showToast('유료 회원 전환 후 이용 가능해요 ✨');
}

/* ─── 토스트 ─── */
function showToast(msg) {
  const old = document.querySelector('.toast');
  if(old) old.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 2200);
}

/* ─── 플로팅 텍스트 ─── */
function spawnFloat(x, y) {
  const t = themes[state.theme];
  const msg = t.msgs[Math.floor(Math.random() * t.msgs.length)];
  const el = document.createElement('div');
  el.className = 'float-msg';
  const rot = (-10 + Math.random() * 20).toFixed(1);
  el.style.cssText = `
    left:${x + (-50 + Math.random()*100)}px;
    top:${y - 10}px;
    font-size:${16 + Math.random()*12}px;
    color:${themes[state.theme].acc};
    --r:${rot}deg;
  `;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1700);
}

/* ─── 파티클 ─── */
function spawnParticles(x, y) {
  const colors = themes[state.theme].particles;
  for(let i=0;i<10;i++){
    const el = document.createElement('div');
    el.className = 'particle';
    const angle = (Math.PI * 2 * i) / 10 + Math.random() * .4;
    const d = 50 + Math.random() * 70;
    el.style.cssText = `
      left:${x}px;top:${y}px;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      --px:${(Math.cos(angle)*d).toFixed(0)}px;
      --py:${(Math.sin(angle)*d - 20).toFixed(0)}px;
      border-radius:${Math.random()>.5?'50%':'3px'};
    `;
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), 900);
  }
}

/* ─── Web Audio 클릭음 ─── */
let actx;
function playClick() {
  try {
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.connect(g); g.connect(actx.destination);
    o.type = 'sine';
    o.frequency.setValueAtTime(580, actx.currentTime);
    o.frequency.exponentialRampToValueAtTime(180, actx.currentTime+.08);
    g.gain.setValueAtTime(.2, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime+.1);
    o.start(); o.stop(actx.currentTime+.12);
  } catch(e){}
}

/* ─── 메인 클릭 핸들러 ─── */
const body = document.getElementById('keycapBody');

function handlePress(e) {
  if(state.adShowing || state.resetShowing) return;

  body.classList.add('pressed');
  playClick();
  state.count++;

  const num = document.getElementById('countNum');
  num.textContent = state.count;
  num.classList.remove('pop');
  void num.offsetWidth;
  num.classList.add('pop');

  updateProgress();

  const cx = e?.clientX ?? window.innerWidth/2;
  const cy = e?.clientY ?? window.innerHeight/2;
  spawnFloat(cx, cy);
  if(state.count % 5 === 0) spawnParticles(cx, cy);

  // 광고 체크
  if(checkAd()) { setTimeout(showAd, 100); return; }

  // 리셋 체크 (무료 회원)
  if(state.tier === 'free' && state.count >= 159) {
    setTimeout(showReset, 300);
  }
}

body.addEventListener('mousedown', handlePress);
body.addEventListener('touchstart', e => { e.preventDefault(); handlePress(e.touches[0]); }, {passive:false});
document.addEventListener('mouseup', () => body.classList.remove('pressed'));
document.addEventListener('touchend', () => body.classList.remove('pressed'));

document.addEventListener('keydown', e => {
  if(e.code === 'Space' && !e.repeat) {
    e.preventDefault();
    body.classList.add('pressed');
    const r = body.getBoundingClientRect();
    handlePress({clientX: r.left+r.width/2, clientY: r.top+r.height/2});
  }
});
document.addEventListener('keyup', e => { if(e.code==='Space') body.classList.remove('pressed'); });

/* ─── 초기화 ─── */
buildBgKeys();
</script>
</body>
</html>
